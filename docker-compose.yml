services:
  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: fiap-route-mcp
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_MAP_OUTPUT: /app/output/mapa_pontos.html
      MCP_MAP_PUBLIC_PATH: mcp_server/output/mapa_pontos.html
      MCP_ROUTE_MAP_OUTPUT: /app/output/mapa_rota.html
      MCP_ROUTE_MAP_PUBLIC_PATH: mcp_server/output/mapa_rota.html
      MCP_ROUTE_HISTORY_OUTPUT: /app/output/historico_rotas.json
    ports:
      - "8000:8000"
    volumes:
      - ./mcp_server/output:/app/output
      - ./cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  route-agent:
    build:
      context: ./route_agent
    container_name: fiap-route-agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MCP_SERVER_URL: http://mcp-server:8000/sse
      POINTS_MAP_HTML_PATH: /maps/mapa_pontos.html
      ROUTE_MAP_HTML_PATH: /maps/mapa_rota.html
    ports:
      - "8501:8501"
    volumes:
      - ./mcp_server/output:/maps:ro
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
